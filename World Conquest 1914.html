 $('#ov').innerHTML=`<h1>WORLD CONQUEST 1914</h1><p class="m">Grand strategy · realistic taxes, debt, inflation, alliances · IMPOSSIBLE difficulty</p>
 <div class="card"><b>★ Palestine (recommended challenge)</b><br>An Ottoman vassal of 0.75M people. Tribute to Constantinople, tariffs capped by treaty, a treasury of pennies, 2,000 gendarmes — and the Great War starts in July. Survive, break free, then conquer the world.</div>
 <div class="row"><button onclick="newGame('PAL')">Play as Palestine</button></div>
 <p>Or pick a power (easier):</p><select id="sc">${all.slice(0,60).map(c=>`<option value="${c}">${DB.NM[c]||c} (GDP rank ${all.indexOf(c)+1})</option>`).join('')}</select>
 <div class="row"><button class="s" onclick="newGame($('#sc').value)">Play selected</button></div>
 <div class="card m">Rules: each tap on <i>Next month</i> advances one month. Tax too little and you go broke; tax too much and people evade, riot, or starve. Borrowing costs more the weaker you are. Win by controlling 60% of the world’s population.</div>`}
function init(){cv=$('#cv');ctx=cv.getContext('2d');build();fit();addEventListener('resize',fit);
 let pts={},last=0,moved=0,sd=0;
 cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);pts[e.pointerId]=[e.clientX,e.clientY];moved=0;if(Object.keys(pts).length==2){const v=Object.values(pts);sd=Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1])}};
 cv.onpointermove=e=>{const o=pts[e.pointerId];if(!o)return;const n=Object.keys(pts).length;
  if(n==1){const dx=e.clientX-o[0],dy=e.clientY-o[1];moved+=Math.abs(dx)+Math.abs(dy);cam.x+=dx;cam.y+=dy;dirty=1}
  pts[e.pointerId]=[e.clientX,e.clientY];
  if(n==2){const v=Object.values(pts),d=Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]);if(sd){cam.k=cl(cam.k*d/sd,.8,60);dirty=1}sd=d;moved=99}};
 cv.onpointerup=e=>{if(moved<6&&S){const i=pick(e.clientX,e.clientY);if(i>=0){sel=i;tab='prov';dirty=1;ui()}}delete pts[e.pointerId];sd=0};
 cv.onwheel=e=>{e.preventDefault();cam.k=cl(cam.k*(e.deltaY<0?1.2:.83),.8,60);dirty=1};
 draw();menu()}
init();
</script></body></html>
